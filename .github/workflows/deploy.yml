name: Deploy Christmas Wishlist to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Check database deployment secrets
        id: database
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ -n "$SUPABASE_ACCESS_TOKEN" ] && [ -n "$SUPABASE_PROJECT_ID" ] && [ -n "$SUPABASE_DB_PASSWORD" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Supabase database secrets are incomplete. Skipping database migrations."
          fi

      - name: Link Supabase project
        if: steps.database.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Push database migrations
        if: steps.database.outputs.enabled == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
        run: supabase db push --yes --remote="$SUPABASE_PROJECT_ID"

      - name: Determine deployment paths
        id: deployment
        env:
          CUSTOM_DOMAIN: ${{ secrets.CUSTOM_DOMAIN }}
          REPOSITORY_NAME: ${{ github.event.repository.name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          CUSTOM_DOMAIN="$(echo "$CUSTOM_DOMAIN" | tr -d '[:space:]' | sed -e 's|^https\?://||' -e 's|/$||')"
          REPOSITORY_NAME_LOWER="$(echo "$REPOSITORY_NAME" | tr '[:upper:]' '[:lower:]')"
          OWNER_LOWER="$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')"

          if [ -n "$CUSTOM_DOMAIN" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "custom_domain=$CUSTOM_DOMAIN" >> "$GITHUB_OUTPUT"
          elif [ "$REPOSITORY_NAME_LOWER" = "${OWNER_LOWER}.github.io" ]; then
            echo "base_path=/" >> "$GITHUB_OUTPUT"
            echo "custom_domain=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/$REPOSITORY_NAME/" >> "$GITHUB_OUTPUT"
            echo "custom_domain=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build PWA
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY || secrets.SUPABASE_ANON_KEY }}
          VITE_BASE_PATH: ${{ steps.deployment.outputs.base_path }}
        run: npm run build

      - name: Add custom domain
        if: steps.deployment.outputs.custom_domain != ''
        env:
          CUSTOM_DOMAIN: ${{ steps.deployment.outputs.custom_domain }}
        run: echo "$CUSTOM_DOMAIN" > dist/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

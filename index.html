<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#dc2626" />
    <meta
      name="description"
      content="A family wishlist with no accounts. Add wishes, share product links and reserve gifts."
    />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Wishlist" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Christmas Wishlist</title>
    <script>
      // Restore the original URL after the GitHub Pages 404 redirect.
      (function () {
        var location = window.location;
        if (location.search.indexOf('?/') === 0) {
          var parts = location.search.slice(2).split('&');
          var route = parts.shift() || '';
          window.history.replaceState(
            null,
            '',
            location.pathname +
              route +
              (parts.length ? '?' + parts.join('&') : '') +
              location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem">
        Please enable JavaScript to use the Christmas Wishlist.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

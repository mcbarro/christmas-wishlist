<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#f7f3ec" />
    <meta
      name="description"
      content="A family wishlist with no accounts. Add wishes, share product links and reserve gifts."
    />
    <meta name="color-scheme" content="light dark" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Wishlist" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>Christmas Wishlist</title>
    <script>
      // Apply the saved theme before the app renders to avoid a flash.
      (function () {
        var theme = 'light';
        try {
          var storedTheme = window.localStorage.getItem('christmas-wishlist:theme');
          if (
            storedTheme === 'dark' ||
            storedTheme === 'christmas'
          ) {
            theme = storedTheme;
          }
        } catch (error) {
          // localStorage can be unavailable in private browsing modes.
        }
        document.documentElement.dataset.theme = theme;
        document.documentElement.classList.toggle('dark', theme === 'dark');
        var themeColor = document.querySelector('meta[name="theme-color"]');
        if (themeColor) {
          themeColor.setAttribute(
            'content',
            theme === 'dark'
              ? '#070b14'
              : theme === 'christmas'
                ? '#0b3d2e'
                : '#f7f3ec'
          );
        }
        var statusBar = document.querySelector(
          'meta[name="apple-mobile-web-app-status-bar-style"]'
        );
        if (statusBar) {
          statusBar.setAttribute(
            'content',
            theme === 'dark' ? 'black-translucent' : 'default'
          );
        }
      })();
    </script>
    <script>
      // Restore the original URL after the GitHub Pages 404 redirect.
      (function () {
        var location = window.location;
        if (location.search.indexOf('?/') === 0) {
          var parts = location.search.slice(2).split('&');
          var route = parts.shift() || '';
          window.history.replaceState(
            null,
            '',
            location.pathname +
              route +
              (parts.length ? '?' + parts.join('&') : '') +
              location.hash
          );
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <p style="font-family: sans-serif; padding: 2rem">
        Please enable JavaScript to use the Christmas Wishlist.
      </p>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
